name: Build Windows EXE

# Builds BringasRenderPC.exe on Windows (PyInstaller cannot cross-build
# a Windows .exe from Linux, so the build runs here on windows-latest).
# Every push to main produces a downloadable artifact.
# Pushing a tag like v1.0.1 also creates a GitHub Release with the .exe.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile bringas_render_pc.py ffmpeg_utils.py test_logic.py

      - name: Run logic tests
        run: python test_logic.py

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name BringasRenderPC bringas_render_pc.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BringasRenderPC-windows
          path: dist/BringasRenderPC.exe
          if-no-files-found: error

      - name: Release EXE on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BringasRenderPC.exe
          generate_release_notes: true
